<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Basic calculator</title>
</head>
<body>
    <div id="container">
        <div id="display"></div>
        <div class="delete-container">
            <button class="clear bttn" aria-label="Clear all input" title="Clear all">Clear</button>
            <button class="delete bttn" aria-label="Delete last entered input" title="Delete last entry">Delete</button>
        </div>
        <div id="bttns">
            <div id="number-container">
                <div id="num-bttns"></div>
                <div id="misc-bttns"></div>
            </div>
            <div id="operator-container"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
